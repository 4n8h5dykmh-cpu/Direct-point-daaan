<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fffafa" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <title>다이렉트 포인트 현황</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #fffafa;
      color: #10254c;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 14px 88px;
    }

    h1 {
      margin: 6px 0 18px;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.9px;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #f1eded;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(30, 40, 70, 0.04);
    }

    .label {
      color: #7a8595;
      font-size: 12px;
      margin-bottom: 4px;
    }

    /* 예식일 */
    .wedding-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 17px 18px;
      margin-bottom: 10px;
    }

    .wedding-date {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.6px;
    }

    .dday {
      min-width: 88px;
      padding: 12px 10px;
      text-align: center;
      border-radius: 15px;
      background: #fff0f5;
      color: #ff2c69;
      font-size: 21px;
      font-weight: 800;
    }

    /* 목표 / 현재 */
    .point-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 9px;
    }

    .point-card {
      padding: 16px 14px;
    }

    .big-number {
      margin-top: 3px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.8px;
      white-space: nowrap;
    }

    .current {
      color: #ff2c69;
    }

    /* 분야별 포인트 */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 11px;
    }

    .category {
      min-height: 120px;
      padding: 14px 6px 12px;
      text-align: center;
    }

    .icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
      border-radius: 13px;
      font-size: 20px;
    }

    .pink {
      background: #fff0f4;
    }

    .blue {
      background: #eef8ff;
    }

    .brown {
      background: #fff4ed;
    }

    .category-title {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
    }

    .category-point {
      margin-top: 6px;
      font-size: 16px;
      font-weight: 800;
    }

    .category-count {
      margin-top: 3px;
      font-size: 11px;
      color: #929cab;
    }

    /* 이번 달 포인트 */
    .monthly {
      padding: 17px 15px 15px;
    }

    .monthly-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 3px;
    }

    .monthly-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .month {
      font-size: 12px;
      color: #647084;
      white-space: nowrap;
      padding-top: 2px;
    }

    .today {
      margin-bottom: 14px;
      color: #8993a2;
      font-size: 11px;
    }

    .task {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 9px;
      padding: 10px 0;
      border-bottom: 1px solid #f2f2f4;
    }

    .task:last-of-type {
      border-bottom: 0;
    }

    .task-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
    }

    .task-title-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 7px;
    }

    .task-title {
      font-size: 13px;
      font-weight: 700;
    }

    .task-count {
      font-size: 12px;
      font-weight: 700;
    }

    .progress {
      height: 8px;
      background: #eceff3;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      border-radius: 999px;
    }

    .bar-pink {
      width: 60%;
      background: linear-gradient(90deg, #ff5e91, #ff7ca7);
    }

    .bar-blue {
      width: 60%;
      background: linear-gradient(90deg, #49b7f5, #61caf8);
    }

    .bar-green {
      width: 100%;
      background: linear-gradient(90deg, #40c985, #5bd99b);
    }

    .detail-btn {
      margin-top: 13px;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 12px;
      color: #ff2c69;
      background: #fff0f4;
      font-size: 12px;
      font-weight: 800;
    }

    /* 하단 메뉴 */
    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      height: 74px;
      padding: 6px 4px max(8px, env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.98);
      border-top: 1px solid #eeeeef;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      z-index: 20;
    }

    .nav-item {
      text-decoration: none;
      color: #687386;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px;
      border-radius: 13px;
      font-size: 9px;
      white-space: nowrap;
    }

    .nav-icon {
      font-size: 18px;
      line-height: 1;
    }

    .nav-item.active {
      background: #fff0f4;
      color: #ff2c69;
      font-weight: 800;
    }

    /* 작은 아이폰 대응 */
    @media (max-width: 380px) {
      .app {
        padding-left: 10px;
        padding-right: 10px;
      }

      h1 {
        font-size: 22px;
      }

      .big-number {
        font-size: 19px;
      }

      .category-title {
        font-size: 10px;
      }

      .category-point {
        font-size: 15px;
      }

      .monthly-title {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>다이렉트 포인트 현황</h1>

    <section class="card wedding-card">
      <div>
        <div class="label">예식일</div>
        <div class="wedding-date">2027.09.04 (토)</div>
      </div>

      <div class="dday" id="dday">D-359</div>
    </section>

    <section class="point-grid">

      <div class="card point-card">
        <div class="label">포인트 목표</div>
        <div class="big-number">3,000,000원</div>
      </div>

      <div class="card point-card">
        <div class="label">현재 포인트</div>
        <div class="big-number current">244,000원</div>
      </div>

    </section>

    <section class="category-grid">

      <div class="card category">
        <div class="icon pink">👥</div>
        <div class="category-title">소개 가입 포인트</div>
        <div class="category-point">73,000원</div>
        <div class="category-count">3건</div>
      </div>

      <div class="card category">
        <div class="icon blue">✏️</div>
        <div class="category-title">블로그 활동 포인트</div>
        <div class="category-point">171,000원</div>
        <div class="category-count">28건</div>
      </div>

      <div class="card category">
        <div class="icon brown">☕️</div>
        <div class="category-title">카페 활동 포인트</div>
        <div class="category-point">0원</div>
        <div class="category-count">0건</div>
      </div>

    </section>

    <section class="card monthly">

      <div class="monthly-head">
        <div class="monthly-title">놓치면 안되는 이번 달 포인트</div>
        <div class="month">2026년 9월</div>
      </div>

      <div class="today" id="todayText">
        오늘은 9월 11일 | 이번 달 D-19
      </div>

      <div class="task">

        <div class="task-icon pink">💬</div>

        <div>
          <div class="task-title-row">
            <div class="task-title">댓글</div>
            <div class="task-count">6 / 10</div>
          </div>

          <div class="progress">
            <div class="bar-pink"></div>
          </div>
        </div>

      </div>

      <div class="task">

        <div class="task-icon blue">📄</div>

        <div>
          <div class="task-title-row">
            <div class="task-title">일기</div>
            <div class="task-count">12 / 20</div>
          </div>

          <div class="progress">
            <div class="bar-blue"></div>
          </div>
        </div>

      </div>

      <div class="task">

        <div class="task-icon" style="background:#ecfff5;">🍴</div>

        <div>
          <div class="task-title-row">
            <div class="task-title">맛집 소개글</div>
            <div class="task-count">1 / 1</div>
          </div>

          <div class="progress">
            <div class="bar-green"></div>
          </div>
        </div>

      </div>

      <button class="detail-btn">이번 달 포인트 자세히 보기 ›</button>

    </section>

  </main>

  <nav class="bottom-nav">

    <a class="nav-item active" href="#">
      <div class="nav-icon">⌂</div>
      <div>홈</div>
    </a>

    <a class="nav-item" href="#">
      <div class="nav-icon">☷</div>
      <div>적립내역</div>
    </a>

    <a class="nav-item" href="#">
      <div class="nav-icon">▣</div>
      <div>월별신청</div>
    </a>

    <a class="nav-item" href="#">
      <div class="nav-icon">☕️</div>
      <div>카페활동</div>
    </a>

    <a class="nav-item" href="#">
      <div class="nav-icon">✎</div>
      <div>블로그</div>
    </a>

    <a class="nav-item" href="#">
      <div class="nav-icon">⌯</div>
      <div>정보공유</div>
    </a>

  </nav>

  <script>
    // 예식일까지 D-day 자동 계산
    const weddingDate = new Date("2027-09-04T00:00:00");
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const diff = weddingDate - today;
    const days = Math.ceil(diff / (1000 * 60 * 60 * 24));

    document.getElementById("dday").textContent =
      days >= 0 ? "D-" + days : "D+" + Math.abs(days);

    // 오늘 날짜 + 이번 달 남은 날짜 자동 계산
    const now = new Date();

    const month = now.getMonth() + 1;
    const date = now.getDate();

    const lastDay = new Date(
      now.getFullYear(),
      now.getMonth() + 1,
      0
    ).getDate();

    const remainDays = lastDay - date;

    document.getElementById("todayText").textContent =
      `오늘은 ${month}월 ${date}일 | 이번 달 D-${remainDays}`;
  </script>

</body>
</html>
